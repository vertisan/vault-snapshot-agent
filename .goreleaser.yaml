# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: vault-snapshot-agent

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

checksum:
  name_template: "checksums.txt"

# Software Bill of Materials, one SPDX JSON document per archive, generated by syft.
# Published as <archive>.sbom.json and listed in checksums.txt.
# https://goreleaser.com/customization/sbom
sboms:
  - artifacts: archive

# Keyless (Sigstore) signature over checksums.txt.
# Every other release asset - archives and SBOMs alike - is listed in
# checksums.txt, so signing that single file transitively covers the release.
# https://goreleaser.com/customization/sign
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Multi-arch container image built from the binaries produced above, so the
# binary inside the image is byte-identical to the one in the archive.
# https://goreleaser.com/customization/dockers_v2
dockers_v2:
  - images:
      - "ghcr.io/vertisan/vault-snapshot-agent"
    tags:
      - "{{ .Tag }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A custom Vault Agent for managing snapshots automatically."
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: "MIT"
    annotations:
      "index:org.opencontainers.image.description": "A custom Vault Agent for managing snapshots automatically."

# Keyless (Sigstore) signature over every pushed image digest.
# https://goreleaser.com/customization/docker_sign
docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
